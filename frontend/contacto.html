<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="components.js"></script>
</head>

<body>
    <!-- Inicia Navbar -->
    <div data-include="components/header.html"></div>

    <!-- INICIA SECCION DE INFORMACION DE CONTACTO Y FORMULARIO-->

        <div class="container my-5" style="max-width: 600px;">
            <div class="card card-custom p-4 p-md-5 bg-white">
            
            <!-- Encabezado -->
            <h2 class="fw-bold mb-2 text-dark">Cuéntanos sobre tu negocio</h2>
            <p class="text-muted mb-4">Déjanos un mensaje. Te responderemos por correo en un plazo de un día hábil.</p>
            
            <form>
                <!-- Nombre completo y Correo electrónico -->
                <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="nombre" class="form-label fw-bold text-dark">Nombre completo *</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label fw-bold text-dark">Correo electrónico *</label>
                    <input type="email" class="form-control" id="email" placeholder="tu@negocio.com" required>
                </div>
                </div>

                <!-- Nombre de tu comercio -->
                <div class="mb-3">
                <label for="comercio" class="form-label fw-bold text-dark">Nombre de tu comercio</label>
                <div class="input-group">
                    <span class="input-group-text text-muted" id="store-addon">
                    <i class="bi bi-shop"></i>
                    </span>
                    <input type="text" class="form-control" id="comercio" placeholder="¿Cómo se llama tu negocio?" aria-describedby="store-addon">
                </div>
                </div>

                <!-- Selector: ¿En qué podemos ayudarte? -->
                <div class="mb-3">
                <label for="ayuda" class="form-label fw-bold text-dark">¿En qué podemos ayudarte? *</label>
                <select class="form-select" id="ayuda" required>
                    <option selected>Quiero conocer los planes</option>
                    <option value="1">Soporte técnico</option>
                    <option value="2">Información de ventas</option>
                    <option value="3">Otro asunto</option>
                </select>
                </div>

                <!-- Mensaje -->
                <div class="mb-4">
                <label for="mensaje" class="form-label fw-bold text-dark">Mensaje *</label>
                <textarea class="form-control" id="mensaje" rows="4" placeholder="Cuéntanos qué vendes y qué te gustaría automatizar..." required></textarea>
                </div>

                <!-- Checkbox aviso de privacidad -->
                <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" value="" id="privacyCheck" required>
                <label class="form-check-label text-muted small" for="privacyCheck">
                    He leído el aviso de privacidad y acepto el uso de mis datos para recibir una respuesta a esta solicitud.
                </label>
                </div>

                <!-- Botón Enviar -->
                <div class="d-grid mb-3">
                <button type="submit" class="btn btn-purple d-flex align-items-center justify-content-center gap-2">
                    Enviar mensaje <i class="bi bi-arrow-up-right"></i>
                </button>
                </div>

                <!-- Pie del formulario -->
                <p class="text-center text-muted small mb-0">
                * Campos obligatorios. Tus datos no se comparten con terceros.
                </p>
            </form>

            </div>
        </div>


     <!--Footer-->
    <div data-include="components/footer.html"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/7eb6f35784.js" crossorigin="anonymous"></script>

    <script>
        // Muestra las tarjetas de misión y visión con una entrada suave al hacer scroll
        document.addEventListener("DOMContentLoaded", () => {
            const tarjetas = document.querySelectorAll(".af-oculto");

            if (!("IntersectionObserver" in window)) {
                tarjetas.forEach(t => t.classList.add("af-visible"));
                return;
            }

            const observador = new IntersectionObserver((entradas, obs) => {
                entradas.forEach(entrada => {
                    if (entrada.isIntersecting) {
                        entrada.target.classList.add("af-visible");
                        obs.unobserve(entrada.target);
                    }
                });
            }, { threshold: 0.2 });

            tarjetas.forEach(t => observador.observe(t));
        });
    </script>
</body>

</html>
