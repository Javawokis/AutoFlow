<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - AutoFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/components.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div data-include="../components/header.html"></div>

    <!-- Vista principal de Login -->
    <main class="flex-grow-1 login-bg d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                    <div class="card login-card border-0 p-4 p-sm-5">
                        <!-- Encabezado de la tarjeta -->
                        <div class="text-center mb-4">
                            <div class="login-store-badge mx-auto mb-3">
                                <i class="fa-solid fa-store"></i>
                            </div>
                            <p class="login-eyebrow text-uppercase fw-semibold mb-2">
                                Acceso para comercios
                            </p>
                            <h1 class="h3 fw-bold login-title mb-2">Qué bueno verte de nuevo.</h1>
                            <p class="text-muted small mb-0">
                                Inicia sesión para seguir haciendo crecer tu negocio con AutoFlow.
                            </p>
                        </div>

                        <!-- Espacio reservado para que JS muestre Alertas de Bootstrap -->
                        <div id="login-alert-container" aria-live="polite"></div>

                        <!-- Formulario de inicio de sesión -->
                        <form id="login-form" novalidate>
                            <!-- Correo electrónico -->
                            <div class="mb-3">
                                <label for="login-email" class="form-label fw-semibold small login-label">
                                    Correo electrónico
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text login-input-addon">
                                        <i class="fa-regular fa-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control login-input" id="login-email"
                                        name="email" placeholder="tu@negocio.com" autocomplete="email" required>
                                </div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="login-password" class="form-label fw-semibold small login-label">
                                    Contraseña
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text login-input-addon">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control login-input login-password-input"
                                        id="login-password" name="password" placeholder="Ingresa tu contraseña"
                                        autocomplete="current-password" required>
                                    <button type="button" class="btn login-toggle-pass" id="toggle-password"
                                        aria-label="Mostrar u ocultar contraseña">
                                        <i class="fa-regular fa-eye-slash" id="toggle-password-icon"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Recordarme y recuperar contraseña -->
                            <div class="d-flex justify-content-between align-items-center mb-4 small">
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" id="remember-me" name="remember">
                                    <label class="form-check-label text-muted" for="remember-me">
                                        Recordarme
                                    </label>
                                </div>
                                <a href="contacto.html" class="login-link fw-medium text-decoration-none">
                                    ¿Olvidaste tu contraseña?
                                </a>
                            </div>

                            <!-- Botón Iniciar Sesión -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn login-btn-submit">
                                    Iniciar sesión <i class="fa-solid fa-arrow-right ms-1"></i>
                                </button>
                            </div>

                            <!-- Nota información segura -->
                            <p class="text-center text-muted small mb-4">
                                <i class="fa-solid fa-shield-halved text-success me-1"></i>
                                Tu información viaja de forma segura.
                            </p>
                        </form>

                        <hr class="my-3 border-light-subtle">

                        <!-- Enlace hacia productos -->
                        <div class="text-center small">
                            <span class="text-muted d-block mb-1">¿Todavía no tienes un plan?</span>
                            <a href="productos.html" class="login-link fw-semibold text-decoration-none">
                                Encuentra tu solución en Productos <i class="fa-solid fa-arrow-up-right-from-square ms-1"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Botón necesitas ayuda -->
                    <p class="text-center text-muted small mt-4 mb-0">
                        <i class="fa-regular fa-circle-question me-1"></i>
                        ¿Necesitas ayuda para entrar?
                        <a href="contacto.html" class="text-muted text-decoration-underline">Contacta a soporte.</a>
                    </p>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div data-include="../components/footer.html"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/7eb6f35784.js" crossorigin="anonymous"></script>
</body>

</html>
